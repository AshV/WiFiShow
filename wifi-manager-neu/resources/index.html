<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiFi Manager</title>
    <link rel="icon" type="image/png" href="icons/appIcon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app-container">
      <!-- Aurora Background -->
      <div class="aurora-bg"></div>

      <div class="glass-panel">
        <header>
          <div class="header-title">
            <img src="icons/appIcon.png" alt="Wi-Fi Manager Logo" class="header-icon-img" />
            <h1>Wi-Fi Manager</h1>
          </div>
          <div class="actions">
            <input type="search" id="searchInput" placeholder="Search SSID..." />
            <div class="button-group">
              <button id="toggleAllBtn" class="btn secondary has-tooltip tooltip-bottom" data-tooltip="Show/Hide all passwords">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span>Show All</span>
              </button>
              <button id="exportBtn" class="btn secondary has-tooltip tooltip-bottom" data-tooltip="Export as CSV">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>Export</span>
              </button>
              <button id="refreshBtn" class="btn secondary has-tooltip tooltip-bottom" data-tooltip="Refresh networks">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                <span>Refresh</span>
              </button>
            </div>
          </div>
        </header>

        <main>
          <div id="loading" class="loading-state hidden">
            <div class="spinner"></div>
            <p>Fetching networks...</p>
          </div>
          <div id="networkList" class="network-list">
            <!-- Rows injected by JS -->
          </div>
        </main>
      </div>
    </div>
    
    <div id="toast" class="toast">Action completed!</div>

    <!-- Modals -->
    <div id="detailsModal" class="modal hidden">
      <div class="modal-content glass-panel" style="text-align: center;">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <h2 id="modalTitle" style="margin: 0;">Details</h2>
          <button id="closeModalIconBtn" class="icon-btn" title="Close">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div id="qrcode" style="display: none; margin: 0 auto; padding: 1rem; background: white; border-radius: 8px;"></div>
        <pre id="modalText" style="text-align: left;"></pre>
      </div>
    </div>

    <!-- External Libraries -->
    <script src="js/qrcode.min.js"></script>

    <!-- Neutralino.js client -->
    <script src="js/neutralino.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
