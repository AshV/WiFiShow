<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }} - {{ site.description }}</title>
    <meta name="description" content="{{ site.description }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="aurora-bg"></div>
    
    <div class="app-container">
        <header class="glass-panel main-header">
            <div class="logo">
                <!-- Using a placeholder icon or a text logo -->
                <svg viewBox="0 0 24 24" class="wifi-icon" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                <h1>{{ site.title }}</h1>
            </div>
            <nav>
                <a href="#features">Features</a>
                <a href="https://github.com/AshV/WiFiShow">GitHub</a>
            </nav>
        </header>

        <main>
            {{ content }}
        </main>

        <footer class="glass-panel main-footer">
            <p>&copy; 2026 Wi-Fi Show. Open Source.</p>
        </footer>
    </div>
</body>
</html>
